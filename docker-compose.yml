services:
  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_DB: warehause_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./src/WarehouseManagement.API
      dockerfile: Dockerfile

    container_name: warehouse-management-api

    depends_on:
      - postgres

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=warehause_management;Username=postgres;Password=postgres

  web:
    build:
      context: ./src/WarehouseManagement.Web
      dockerfile: Dockerfile

    container_name: warehouse-management-web

    ports:
      - "5000:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

volumes:
  postgres-data: